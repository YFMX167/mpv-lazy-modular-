# MPV-LAZY Modular: isolated config; mpv >= 0.41
vo=gpu-next
gpu-api=vulkan
gpu-context=waylandvk
hwdec=auto-safe
osc=no
osd-bar=no
save-position-on-quit=no
input-ipc-server=
interpolation=no
profile=film

[film]
profile-desc=Film original / SDR
video-sync=audio
interpolation=no
glsl-shaders=
target-colorspace-hint=no
target-trc=bt.1886
target-prim=bt.709
tone-mapping=auto

[anime]
profile-desc=Anime4K SDR mode A medium
profile=film
glsl-shaders=~~/shaders/Anime4K_Clamp_Highlights.glsl:~~/shaders/Anime4K_Restore_CNN_M.glsl:~~/shaders/Anime4K_Upscale_CNN_x2_M.glsl:~~/shaders/Anime4K_AutoDownscalePre_x2.glsl:~~/shaders/Anime4K_AutoDownscalePre_x4.glsl:~~/shaders/Anime4K_Upscale_CNN_x2_M.glsl

[hdr]
profile-desc=HDR output request; verify compositor and display
profile=film
target-colorspace-hint=yes
target-trc=auto
target-prim=auto

[hdr-sdr]
profile-desc=HDR to SDR tone mapping
profile=film
tone-mapping=bt.2390
