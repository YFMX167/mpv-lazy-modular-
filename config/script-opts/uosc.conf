# Persistent controls for both windowed and fullscreen playback.
languages=zh-hans,en
controls=menu,open-file,gap,prev,play-pause,next,gap,playlist,chapters,space,subtitles,audio,audio-device,gap,speed,space,loop-file,fullscreen
controls_size=36
controls_margin=10
controls_spacing=3
controls_persistency=windowed,fullscreen
timeline_style=bar
timeline_size=42
timeline_persistency=windowed,fullscreen
timeline_cache=yes
volume=right
volume_persistency=windowed,fullscreen
top_bar=always
top_bar_title=yes
top_bar_persistency=windowed,fullscreen
menu_item_height=40
menu_min_width=320
scale=1
scale_fullscreen=1.15
