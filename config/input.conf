# uosc context menu and keyboard bindings.
Ctrl+0 apply-profile film; show-text "电影原画 · SDR · 原帧率" #! 电影原画（SDR）
Ctrl+1 apply-profile anime; show-text "动漫增强 · Anime4K · SDR" #! 动漫增强（Anime4K / SDR）
Ctrl+2 apply-profile hdr; show-text "HDR 输出 · 已请求 HDR 色彩空间" #! HDR 输出
Ctrl+3 apply-profile hdr-sdr; show-text "HDR 转 SDR · BT.2390" #! HDR 转 SDR
# ignore #! ---
# script-binding uosc/open-file #! 打开视频…
# script-binding uosc/playlist #! 播放列表
# script-binding uosc/chapters #! 章节
# script-binding uosc/subtitles #! 字幕轨道
# script-binding uosc/load-subtitles #! 加载外挂字幕…
# script-binding uosc/audio #! 音轨
# script-binding uosc/audio-device #! 音频输出设备
# ignore #! ---
# cycle pause #! 播放 / 暂停
# cycle fullscreen #! 全屏 / 窗口
# set speed 1 #! 恢复正常速度
MBTN_RIGHT script-binding uosc/menu
